<svg xmlns="http://www.w3.org/2000/svg" viewBox="122 124 780 780" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Map Monitoring</title>
  <!--
    A globe on a screen, with a place marked on it.

    Drawn as strokes rather than fills because this one file is the favicon, the
    wordmark, the loading screen AND the source app/make-icon.mjs rasterises
    into MapMonitoring.ico at 16px through 256px. A flat line drawing survives
    16px; a filled illustration turns to mud.

    THE PIN IS CUT OUT OF THE WIREFRAME, not laid over it. Drawn simply on top,
    the equator and both meridians run straight through the marker and the whole
    centre reads as a blob — which is what the first attempt did. The mask below
    removes the cage wherever the pin sits, plus a little margin, so the marker
    reads as being in FRONT. A white fill would have done the same job on the
    white reference artwork and then shown as a white teardrop on this app's
    dark title bar; a mask is background-independent.

    The globe carries id="globe" because src/logoGaze.js looks for exactly that
    and translates it toward the pointer. The monitor frame deliberately does
    NOT move, so the effect reads as the globe drifting behind the screen. The
    gaze is capped at 34 units, about 3% of this viewBox, which keeps it inside
    the frame at every size.
  -->
  <defs>
    <!-- White keeps, black removes. The pin is painted black here AND stroked
         black, so the stroke width becomes the clearance ring around it. -->
    <mask id="pinCut">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff" />
      <path d="M512 322
               C462 322 422 362 422 412
               C422 470 512 556 512 556
               C512 556 602 470 602 412
               C602 362 562 322 512 322 Z"
            fill="#000" stroke="#000" stroke-width="46" stroke-linejoin="round" />
    </mask>
  </defs>

  <g fill="none" stroke="#0E9AA2" stroke-width="27"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Monitor: frame, stand posts, base. -->
    <rect x="150" y="175" width="724" height="530" rx="30" ry="30" />
    <path d="M452 705 v100 M572 705 v100" />
    <rect x="325" y="805" width="374" height="48" rx="24" ry="24" />

    <!-- Everything inside the screen moves together. -->
    <g id="globe">
      <!-- Sphere and its wireframe: two meridian ellipses, the polar axis,
           the equator, and one parallel either side of it. The parallels sag
           toward the equator at the centre, which is what reads as depth. -->
      <g id="globe_cage" mask="url(#pinCut)">
        <circle cx="512" cy="440" r="238" />
        <ellipse cx="512" cy="440" rx="118" ry="238" />
        <path d="M512 202 V678" />
        <path d="M274 440 H750" />
        <path d="M312 316 Q512 386 712 316" />
        <path d="M312 564 Q512 494 712 564" />
      </g>

      <!-- The place marker, in front of the cage the mask cleared for it. -->
      <path d="M512 322
               C462 322 422 362 422 412
               C422 470 512 556 512 556
               C512 556 602 470 602 412
               C602 362 562 322 512 322 Z" />
      <circle cx="512" cy="410" r="36" />
    </g>
  </g>
</svg>
